<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven Wallet - Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1b2a;
        }
        .auth-container {
            background-color: #2c2f48;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #4a4d80;
            margin-bottom: 1.5rem;
        }
        .auth-tab-link {
            padding: 0.8rem 1rem;
            cursor: pointer;
            border: none;
            background: none;
            color: #8a8ca8;
            font-size: 1.1rem;
            font-weight: 500;
            position: relative;
            transition: color 0.3s;
        }
        .auth-tab-link.active {
            color: #fff;
        }
        .auth-tab-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #7b4dff;
        }
        .auth-tab-content {
            display: none;
        }
        .auth-tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #cdd0e8;
        }
        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid #5a5d9a;
            background-color: #232436;
            color: #cdd0e8;
        }
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            color: #cdd0e8;
        }
        .remember-me input {
            margin-right: 0.5rem;
        }
        .auth-button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            background-color: #7b4dff;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .auth-button:hover {
            background-color: #6a3ddf;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-tabs">
            <button class="auth-tab-link {% if active_tab == 'login' %}active{% endif %}" onclick="openTab(event, 'login')">Sign In</button>
            <button class="auth-tab-link {% if active_tab == 'register' %}active{% endif %}" onclick="openTab(event, 'register')">Sign Up</button>
        </div>

        <div id="login" class="auth-tab-content {% if active_tab == 'login' %}active{% endif %}">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <button type="submit" class="auth-button">Sign In</button>
            </form>
        </div>

        <div id="register" class="auth-tab-content {% if active_tab == 'register' %}active{% endif %}">
            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" required>
                </div>
                <button type="submit" class="auth-button">Sign Up</button>
            </form>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            document.querySelectorAll('.auth-tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.auth-tab-link').forEach(link => link.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
